[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "road_surveillance"
version = "0.1.0"
description = "Road Surveillance Incident Detection System - Phase 1 Baseline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "pydantic",
    "pyyaml",
    "scipy",
    "shapely",
    "supervision",
    "ultralytics",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]